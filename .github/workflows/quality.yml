name: Quality and PostgreSQL integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: affiliate_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:ci_only_password@localhost:5432/affiliate_test
      JWT_SECRET: ci-only-not-a-deployment-secret-with-sufficient-length
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: ruff check app tests scripts migrations
      - run: ruff format --check app tests scripts migrations
      - run: python -m pytest -q
      - run: pip-audit --disable-pip --no-deps -r requirements-runtime-lock.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --tag relay-platform:ci .
